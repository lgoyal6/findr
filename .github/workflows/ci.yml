name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app and DMG
        run: ./scripts/bundle.sh
      - name: Verify bundled updater
        run: ./scripts/check-bundle.sh
